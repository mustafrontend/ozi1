workflows:
  ios-workflow:
    name: Kuran Pusulam iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.kuranpusulam.matchers"
        APP_STORE_APP_ID: "6808317356"
        APP_STORE_CONNECT_ISSUER_ID: "af8077cc-1f5f-4bae-bebc-9aa57e9577a9"
        APP_STORE_CONNECT_KEY_ID: "244QYXBQN8"
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: Build Next.js Web App
        script: |
          npm run build
      - name: Initialize & Sync Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $CERTIFICATE_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mustafaozturks57@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Kuran Pusulam Android Release Workflow
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: Build Next.js Web App
        script: |
          npm run build
      - name: Initialize & Sync Capacitor Android
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Build Android Release APK & AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease || ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - mustafaozturks57@gmail.com
        notify:
          success: true
          failure: true
