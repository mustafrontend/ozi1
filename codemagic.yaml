workflows:
  ios-release:
    name: Kuran Pusulam iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.kuranpusulam.matchers"
        APP_STORE_CONNECT_ISSUER_ID: "af8077cc-1f5f-4bae-bebc-9aa57e9577a9"
        APP_STORE_CONNECT_KEY_ID: "244QYXBQN8"
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          openssl genrsa -out /tmp/certificate_signing_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --private-key @env:CERTIFICATE_PRIVATE_KEY \
            --certificate-key @file:/tmp/certificate_signing_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Build iOS Xcode App
        script: |
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          if [ -n "$PROFILE_PATH" ]; then
            PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 UUID | tail -n 1 | tr -d '<string>/ \t\r\n')
            echo "Using Provisioning Profile UUID: $PROFILE_UUID"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App" \
              --archive-flags "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID"
          else
            echo "No profile found in default dir, building standard IPA"
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $CERTIFICATE_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - mustafaozturks57@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Kuran Pusulam Android Release Workflow
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: Build Next.js Web App
        script: |
          npm run build
      - name: Initialize & Sync Capacitor Android
        script: |
          npx cap add android || true
          npx cap sync android
      - name: Build Android Release APK & AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease || ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - mustafaozturks57@gmail.com
        notify:
          success: true
          failure: true
